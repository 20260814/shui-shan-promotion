<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>水杉小组店铺推广花费</title>
<style>
:root{font-family:Segoe UI,"Microsoft YaHei",sans-serif;color:#14213d;background:#f4f7fb}*{box-sizing:border-box}body{margin:0;padding:24px}main{max-width:1400px;margin:auto;background:#fff;border:1px solid #dce5f2;border-radius:14px;overflow:hidden;box-shadow:0 8px 28px #1e3a5f12}.hero{background:#17365d;color:white;padding:24px 28px}.hero h1{margin:0;font-size:25px}.hero p{margin:8px 0 0;color:#dce9f8}.toolbar{display:flex;gap:16px;align-items:end;flex-wrap:wrap;padding:18px 24px;background:#f6f9fd;border-bottom:1px solid #dce5f2}.field label{display:block;font-size:12px;color:#52657e;margin-bottom:5px}.field input{font-size:15px;padding:8px 10px;border:1px solid #b8c8dc;border-radius:6px}.hint{margin-left:auto;color:#61748c;font-size:13px}.table-wrap{overflow:auto;padding:16px 20px 22px}table{width:100%;min-width:1120px;border-collapse:collapse;font-size:13px}th{background:#17365d;color:#fff;padding:11px 8px;font-weight:600;white-space:normal;line-height:1.25}td{padding:9px 8px;border-bottom:1px solid #e1e8f1;text-align:right;white-space:nowrap}td:first-child{text-align:left;font-weight:600}tr:nth-child(even) td{background:#fbfcfe}td.input{background:#fff5d6}td.formula{background:#e8f4e5}.cell-input{width:100%;min-width:95px;border:0;background:transparent;text-align:right;font:inherit;color:inherit;outline:0}.cell-input:focus{box-shadow:inset 0 -2px #3d78b8}.pct{width:78px}.total td{font-weight:700;border-top:2px solid #17365d;background:#eef2f7!important}.foot{padding:12px 24px 20px;color:#60738b;font-size:12px}.bad{color:#c0392b}
tbody tr:nth-child(even):not(.total) td:nth-child(n+5){background:#eee8ff!important}tbody tr:nth-child(even):not(.total) td:first-child{color:#5b3c9d}
</style>
</head>
<body>
<main>
  <section class="hero"><h1>水杉小组店铺推广花费</h1><p>截图数据更新页 · 公式列自动计算</p></section>
  <section class="toolbar">
    <div class="field"><label for="cutoff">截止日期</label><input id="cutoff" type="text" value="2026.8.23"></div>
    <div class="field"><label for="monthDays">当月天数</label><input id="monthDays" type="number" value="31" min="1"></div>
    <div class="field"><label for="remainDays">剩余天数</label><input id="remainDays" type="number" value="8" min="0"></div>
    <div class="hint">黄色：每日截图后更新　绿色：公式自动计算</div>
  </section>
  <div class="table-wrap"><table id="tracker"><thead><tr>
    <th>店铺名</th><th>月度目标销售额</th><th>月度目标推广占比</th><th>月度目标推广花费</th><th>目前完成销售额</th><th>目前推广花费占比</th><th>目前推广花费</th><th>剩余推广花费</th><th>剩余天数</th><th>剩余日均推广花费</th>
  </tr></thead><tbody></tbody></table></div>
  <div class="foot">公式：目前推广花费 = 目前完成销售额 × 目前推广花费占比；剩余推广花费 = 月度目标推广花费 − 目前推广花费；剩余日均推广花费 = 剩余推广花费 ÷ 剩余天数。</div>
</main>
<script>
const initial=[['水杉',3450000,.092,317400,2487262.48,.0943],['百朗',550000,.17,93500,376241.1,.1923],['玉杉',10000,.35,3500,4141.7,.1944],['蓝杉',450000,.17,76500,261475.04,.2058],['好拓',30000,.35,10500,15832.03,.3407],['星杉',480000,.17,81600,336587.98,.1701],['贝想家',25000,.35,8750,13817.21,.2967],['金玉',350000,.17,59500,186655.55,.2246],['绿色',350000,.17,59500,246856.85,.2121],['杉宁',90000,.35,31500,60530.59,.3094]];
const tbody=document.querySelector('#tracker tbody'), money=n=>Number(n||0).toLocaleString('zh-CN',{minimumFractionDigits:2,maximumFractionDigits:2}), pct=n=>(Number(n||0)*100).toFixed(2)+'%';
function input(value,row,key,cls=''){return `<input class="cell-input ${cls}" data-row="${row}" data-key="${key}" value="${value}" inputmode="decimal">`}
function render(){
 const days=Number(document.querySelector('#remainDays').value||0);
 let html=''; let totals=[0,0,0,0,0];
 initial.forEach((r,i)=>{
  const spend=r[4]*r[5], remain=r[3]-spend, avg=days?remain/days:0;
  totals[0]+=r[1]; totals[1]+=r[3]; totals[2]+=r[4]; totals[3]+=spend; totals[4]+=remain;
  html+=`<tr><td>${r[0]}</td><td>${money(r[1])}</td><td>${pct(r[2])}</td><td>${money(r[3])}</td><td class="input">${input(r[4],i,4)}</td><td class="input">${input((r[5]*100).toFixed(2),i,5,'pct')}%</td><td class="formula">${money(spend)}</td><td class="formula">${money(remain)}</td><td class="formula">${days}</td><td class="formula">${money(avg)}</td></tr>`;
 });
 html+=`<tr class="total"><td>合计</td><td>${money(totals[0])}</td><td>—</td><td>${money(totals[1])}</td><td>${money(totals[2])}</td><td>—</td><td>${money(totals[3])}</td><td>${money(totals[4])}</td><td>${days}</td><td>${money(days?totals[4]/days:0)}</td></tr>`;
 tbody.innerHTML=html;
 tbody.querySelectorAll('input').forEach(el=>el.addEventListener('change',e=>{const row=+e.target.dataset.row,key=+e.target.dataset.key;let v=parseFloat(e.target.value);if(key===5)v/=100;if(Number.isFinite(v))initial[row][key]=v;render()}));
}
document.querySelector('#remainDays').addEventListener('input',render);render();
</script>
<script>
function injectCompletionRatio(){
  const head=document.querySelector('#tracker thead tr');
  if(!document.querySelector('#completion-ratio-head')){
    const th=document.createElement('th'); th.id='completion-ratio-head'; th.textContent='\u76ee\u524d\u5b8c\u6210\u9500\u552e\u989d\u5360\u6bd4'; head.insertBefore(th,head.children[5]);
  }
  const rows=document.querySelectorAll('#tracker tbody tr');
  rows.forEach((tr,i)=>{
    if(tr.classList.contains('total')){
      if(!tr.querySelector('.completion-ratio')){const td=document.createElement('td');td.className='completion-ratio';td.textContent=pct(initial.reduce((s,r)=>s+r[4],0)/initial.reduce((s,r)=>s+r[1],0));tr.insertBefore(td,tr.children[5]);}
    } else {
      const td=tr.querySelector('.completion-ratio'); if(td) td.remove();
      const c=document.createElement('td'); c.className='formula completion-ratio'; c.textContent=pct(initial[i][4]/initial[i][1]); tr.insertBefore(c,tr.children[5]);
    }
  });
}
injectCompletionRatio();
document.querySelector('#tracker tbody').addEventListener('change',()=>setTimeout(injectCompletionRatio,0));
document.querySelector('#remainDays').addEventListener('input',()=>setTimeout(injectCompletionRatio,0));
</script>
</body></html>
